[package]
name = "tugboat"
description = "Agent Sandbox"
version = "0.4.3"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
cc = "=1.11.2"
serde_json = "=1.0.154"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
base64 = "=0.23.1"
chrono = "=0.4.45"
libc = "=0.2.191"
regex = "=1.13.1"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.11.1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
flate2 = "=1.1.11"
plist = "=1.10.3"
semver = "=1.0.28"
tar = "=0.4.46"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[profile.release]
strip = true
