[package]
name = "tugboat"
description = "Agent Sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
cc = "=1.11.1"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.7.3"

[profile.release]
strip = true
