<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452" role="img" aria-labelledby="title description">
  <title id="title">Two sandboxes, one shared project</title>
  <desc id="description">Two blue volumes carry the yellow Codex and Claude Code marks. Their solid paths meet on a yellow project tile. Their dashed paths stop at opposite edges of the shared plane. An outlined tile sits outside the plane.</desc>
  <metadata>The marks use the same vector paths and proportions as src/providers/agent-logo.ts in Tugboat.</metadata>
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="16" height="16">
      <circle cx="8" cy="8" r="1" fill="#85b6d2"/>
    </pattern>
    <radialGradient id="fade"><stop offset=".44" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
    <mask id="field"><rect width="680" height="452" fill="url(#fade)"/></mask>
    <linearGradient id="plane" x2=".8" y2="1"><stop stop-color="#b4dbff" stop-opacity=".28"/><stop offset="1" stop-color="#79b8fa" stop-opacity=".13"/></linearGradient>
    <g id="projection">
      <path d="m-98 0 98-49 98 49-98 49Z" fill="#316f9f" stroke="#a0cbee" stroke-width="1.2"/>
      <path d="M-96 0v-49m192 49v-49M0 48V-1" fill="none" stroke="#b2d8f3" stroke-opacity=".8" stroke-dasharray="3 5"/>
    </g>
    <g id="volume" stroke-width="1.4" stroke-linejoin="round">
      <path d="m-96-8 96 48v51l-96-48Z" fill="#a8c7ff" stroke="#c5dfff"/>
