    <path d="M279 317L307 331h68l51-25.5M458 226.5l11 5.5v52l-43 21.5"/>
    <path d="m307 331-39 19.5h-16l-31 15.5" stroke-dasharray="3 5"/>
    <path d="m469 232 39 19.5h16l43 21.5" stroke-dasharray="3 5"/>
  </g>
  <path d="m214 362.5 14 7M560 276.5l14-7" stroke="#daebf7" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(409 109)">
    <use href="#volume"/><use href="#claudeMark" x="-24" y="-34" width="48" height="48" fill="#ffe735"/>
  </g>
  <g transform="translate(229 199)">
    <use href="#volume"/><use href="#codexMark" x="-25" y="-35" width="50" height="50" fill="#ffe735"/>
  </g>

  <!-- Solid means shared; the broken outline marks files outside the plane. -->
