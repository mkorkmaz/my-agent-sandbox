    <path d="M21 27h9m-4.5-4.5v9M652 15h9m-4.5-4.5v9M652 427h9m-4.5-4.5v9"/>
  </g>

  <!-- One plane defines the project share. The two volumes stay separate. -->
  <path d="m45 278 332-166 256 128-332 166Z" fill="url(#plane)" stroke="#b5d8f5" stroke-width="1.7"/>
  <path d="m45 286 256 128 332-166" fill="none" stroke="#8ebce3" stroke-width="1.1" opacity=".67"/>
