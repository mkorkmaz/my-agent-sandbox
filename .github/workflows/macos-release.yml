name: macOS release

on:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build the Apple silicon release
    if: ${{ contains(github.event.head_commit.message, 'new-release') }}
    runs-on: macos-15
    outputs:
      version: ${{ steps.config.outputs.version }}
      node: ${{ steps.config.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read application and toolchain versions
        id: config
        run: |
          jq -er '.version | strings | "version=\(.)"' src-tauri/tauri.conf.json >> "$GITHUB_OUTPUT"
          jq -r '"node=\(.frontend.node)", "rust=\(.rust.compiler)"' config/development-versions.json >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.config.outputs.node }}
          cache: npm

      - name: Validate Apple notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: node scripts/release/validate-apple-api-key.mjs

      - name: Install dependencies and run frontend tests
        run: |
          npm ci
          npm test

      - name: Select the Rust toolchain
        env:
          TOOLCHAIN: ${{ steps.config.outputs.rust }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup override set "$TOOLCHAIN"

      - name: Prepare the pinned bundled runtime
        run: npm run native:prepare

      - name: Run Rust, native terminal and hull tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          npm run test:terminal
          npm run test:hull
          npm run test:brig
          node --test tests/native/disk-tools.test.mjs

      - name: Build the release installer
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-macos-release.sh

      - name: Verify and stage the signed packages
        env:
          VERSION: ${{ steps.config.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          installer="$bundle/dmg/Tugboat_${VERSION}_aarch64.dmg"
          archive="$bundle/macos/Tugboat.app.tar.gz"
          node scripts/release/verify-macos-release.mjs "$installer" "$archive" "$VERSION"
          mkdir -p release-assets
          cp "$installer" "$archive" "$archive.sig" release-assets/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-assets
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish the GitHub Release
    needs: test-and-build
    if: github.repository == 'reformo/tugboat'
    runs-on: macos-15
    concurrency:
      group: macos-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.test-and-build.outputs.node }}
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-assets
          path: release-assets

      - name: Verify and publish the four release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-and-build.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/release/publish-macos-release.mjs "$VERSION" release-assets
